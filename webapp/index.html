<!DOCTYPE html>
<html dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redigo Logistics Cockpit</title>
  <style>
    .errBox { padding: 20px; margin: 20px; background: #fff3f3; border: 2px solid #cc0000; border-radius: 8px; font-family: monospace; font-size: 13px; color: #cc0000; white-space: pre-wrap; }
    #loadMsg { padding: 40px; font-family: Arial; text-align: center; }
    html, body { height: 100% !important; margin: 0; overflow: hidden; }
    #uiArea { height: 100%; }
    .sapUiLoginFlex { min-height: 90vh !important; }
  </style>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      if (msg === "Script error." && !url) return true;
      var detail = msg + "\n" + (url || "(unknown)") + ":" + line;
      if (err && err.stack) detail += "\n" + err.stack;
      document.body.insertAdjacentHTML("beforeend", '<div class="errBox">JS Error: ' + detail + '</div>');
    };
    window.addEventListener("unhandledrejection", function(e) {
      var msg = e.reason ? (e.reason.message || String(e.reason)) : "Unknown";
      var stack = e.reason && e.reason.stack ? "\n" + e.reason.stack : "";
      document.body.insertAdjacentHTML("beforeend", '<div class="errBox">Unhandled Promise: ' + msg + stack + '</div>');
    });

    // Detect language: localStorage > browser/OS > fallback "en"
    (function() {
      var supported = ["tr", "en", "de", "fr", "es"];
      var stored = localStorage.getItem("redigo_language");
      if (stored && supported.indexOf(stored) >= 0) {
        window._redigoLang = stored;
      } else {
        var browserLang = (navigator.language || navigator.userLanguage || "en").toLowerCase().split("-")[0];
        window._redigoLang = (supported.indexOf(browserLang) >= 0) ? browserLang : "en";
      }
      document.documentElement.lang = window._redigoLang;
    })();

    // i18n messages for pre-SAPUI5 loading screens
    (function() {
      var _msgs = {
        tr: { checking: "Sistem kontrol ediliyor...", verifying: "Oturum do\u011frulan\u0131yor...", loading: "Uygulama y\u00fckleniyor...", backendErr: "Backend ba\u011flant\u0131s\u0131 kurulamad\u0131", loadingInit: "Y\u00fckleniyor..." },
        en: { checking: "Checking system...", verifying: "Verifying session...", loading: "Loading application...", backendErr: "Backend connection failed", loadingInit: "Loading..." },
        de: { checking: "System wird gepr\u00fcft...", verifying: "Sitzung wird \u00fcberpr\u00fcft...", loading: "Anwendung wird geladen...", backendErr: "Backend-Verbindung fehlgeschlagen", loadingInit: "Wird geladen..." },
        fr: { checking: "V\u00e9rification du syst\u00e8me...", verifying: "V\u00e9rification de la session...", loading: "Chargement de l'application...", backendErr: "Connexion au backend \u00e9chou\u00e9e", loadingInit: "Chargement..." },
        es: { checking: "Verificando sistema...", verifying: "Verificando sesi\u00f3n...", loading: "Cargando aplicaci\u00f3n...", backendErr: "Conexi\u00f3n con backend fallida", loadingInit: "Cargando..." }
      };
      window._redigoMsg = _msgs[window._redigoLang] || _msgs.en;
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"com.redigo.logistics.cockpit": "./"}'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-libs="sap.m,sap.ui.layout,sap.ui.table,sap.ui.unified,sap.tnt"
  ></script>
  <script>
    function showErr(msg) {
      document.body.insertAdjacentHTML("beforeend", '<div class="errBox">' + msg + '</div>');
    }

    var BASE_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
      ? "http://localhost:3000" : "";

    sap.ui.require([
      "sap/ui/core/Component",
      "sap/ui/core/ComponentContainer",
      "sap/ui/core/mvc/XMLView",
      "sap/ui/model/resource/ResourceModel"
    ], function (Component, ComponentContainer, XMLView, ResourceModel) {

      // Dili SAPUI5 core'a uygula (bootstrap'tan sonra, runtime'da)
      sap.ui.getCore().getConfiguration().setLanguage(window._redigoLang);

      // Tema uygula (bootstrap'tan SONRA)
      var themePref = localStorage.getItem("redigo_theme") || "auto";
      if (themePref === "dark" || (themePref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        sap.ui.getCore().applyTheme("sap_horizon_dark");
      }
      if (themePref === "auto") {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(e) {
          var c = localStorage.getItem("redigo_theme");
          if (c && c !== "auto") return;
          sap.ui.getCore().applyTheme(e.matches ? "sap_horizon_dark" : "sap_horizon");
        });
      }

      var oI18nModel = new ResourceModel({
        bundleName: "com.redigo.logistics.cockpit.i18n.i18n",
        supportedLocales: ["", "tr", "en", "de", "fr", "es"],
        fallbackLocale: "en"
      });

      // Login controller'dan dil degistiginde i18n modelini guncelle
      window._redigoUpdateI18n = function(sLang) {
        oI18nModel = new ResourceModel({
          bundleName: "com.redigo.logistics.cockpit.i18n.i18n",
          supportedLocales: ["", "tr", "en", "de", "fr", "es"],
          fallbackLocale: "en"
        });
      };

      // ── Auth Gate ──
      function checkSetup() {
        document.getElementById("loadMsg").textContent = window._redigoMsg.checking;
        fetch(BASE_URL + "/api/auth/setup-status")
          .then(function(r) { return r.json(); })
          .then(function(d) {
            if (d.needs_setup) {
              showSetup();
            } else {
              checkToken();
            }
          })
          .catch(function(err) {
            showErr(window._redigoMsg.backendErr + ":\n" + err.message + "\n\nPort 3000");
          });
      }

      function showSetup() {
        document.getElementById("loadMsg").style.display = "none";
        XMLView.create({ viewName: "com.redigo.logistics.cockpit.view.Setup" })
          .then(function(oView) {
            oView.setModel(oI18nModel, "i18n");
            window._redigoShowLogin = function() {
              oView.destroy();
              showLogin();
            };
            oView.placeAt("uiArea");
          })
          .catch(function(err) {
            showErr("Setup view yuklenemedi:\n" + err.message);
          });
      }

      function showLogin() {
        document.getElementById("loadMsg").style.display = "none";
        // Onceki view varsa temizle
        var uiArea = document.getElementById("uiArea");
        if (uiArea) uiArea.innerHTML = "";

        XMLView.create({ viewName: "com.redigo.logistics.cockpit.view.Login" })
          .then(function(oView) {
            oView.setModel(oI18nModel, "i18n");
            window._redigoLoadApp = function() {
              oView.destroy();
              loadApp();
            };
            window._redigoShowForgotPassword = function() {
              oView.destroy();
              showForgotPassword();
            };
            oView.placeAt("uiArea");
          })
          .catch(function(err) {
            showErr("Login view yuklenemedi:\n" + err.message);
          });
      }

      function showForgotPassword() {
        var uiArea = document.getElementById("uiArea");
        if (uiArea) uiArea.innerHTML = "";

        XMLView.create({ viewName: "com.redigo.logistics.cockpit.view.ForgotPassword" })
          .then(function(oView) {
            oView.setModel(oI18nModel, "i18n");
            window._redigoShowLogin = function() {
              oView.destroy();
              showLogin();
            };
            oView.placeAt("uiArea");
          })
          .catch(function(err) {
            showErr("ForgotPassword view yuklenemedi:\n" + err.message);
          });
      }

      function checkToken() {
        var token = localStorage.getItem("redigo_token");
        if (!token) {
          showLogin();
          return;
        }
        document.getElementById("loadMsg").textContent = window._redigoMsg.verifying;
        fetch(BASE_URL + "/api/auth/me", {
          headers: { "Authorization": "Bearer " + token }
        })
          .then(function(r) {
            if (r.status === 401) {
              localStorage.removeItem("redigo_token");
              showLogin();
              return null;
            }
            return r.json();
          })
          .then(function(d) {
            if (!d) return;
            if (d.user) {
              loadApp();
            } else {
              localStorage.removeItem("redigo_token");
              showLogin();
            }
          })
          .catch(function() {
            localStorage.removeItem("redigo_token");
            showLogin();
          });
      }

      function loadApp() {
        document.getElementById("loadMsg").textContent = window._redigoMsg.loading;
        var uiArea = document.getElementById("uiArea");
        if (uiArea) uiArea.innerHTML = "";

        Component.create({
          name: "com.redigo.logistics.cockpit"
        }).then(function(oComponent) {
          document.getElementById("loadMsg").style.display = "none";
          new ComponentContainer({
            component: oComponent,
            height: "100%"
          }).placeAt("uiArea");
        }).catch(function(err) {
          showErr("Component.create FAILED:\n" + err.message + "\n\n" + (err.stack || ""));
        });
      }

      // Baslat — DOM hazir olduktan sonra
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", checkSetup);
      } else {
        checkSetup();
      }
    });
  </script>
</head>
<body class="sapUiBody sapUiSizeCompact">
  <div id="loadMsg" role="status" aria-live="polite">Loading...</div>
  <script>document.getElementById("loadMsg").textContent = window._redigoMsg.loadingInit;</script>
  <div id="uiArea" role="main" aria-label="Redigo Logistics Cockpit" style="height:100%"></div>
</body>
</html>
